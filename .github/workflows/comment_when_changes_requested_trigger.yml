name: Trigger comment action

on:
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

jobs:
  get_data:
    name: Get event data
    if: ${{ github.event.review.state == 'changes_requested' && github.event.review.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Get event data
        env:
          EVENT_DATA: ${{ toJSON(github.event) }}
        run: printf '%s\n' "$EVENT_DATA" > ./event_data.json
      - name: Upload event data
        uses: actions/upload-artifact@v4.6.2
        with:
          name: event_data
          path: ./event_data.json
          retention-days: 1
