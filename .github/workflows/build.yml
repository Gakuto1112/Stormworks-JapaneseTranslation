name: Build

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - scripts/**
      - .github/workflows/**
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - scripts/**
      - .github/workflows/**

jobs:
  call_build_core:
    name: Call build core workflow
    permissions:
      contents: read
    uses: ./.github/workflows/build_core.yml
